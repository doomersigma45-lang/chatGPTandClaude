name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - name: Build jar
        run: |
          set -o pipefail
          gradle build --stacktrace --console=plain 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E "error:|What went wrong|Execution failed|Could not|FAILED|Caused by|symbol:|location:" -A2 build.log | head -80 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=Build failed::${msg}"
      - uses: actions/upload-artifact@v4
        with:
          name: claude-content-jar
          path: build/libs/*.jar
      - name: Publish jar to the jar branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp build/libs/*.jar "$RUNNER_TEMP/out/"
          cd "$RUNNER_TEMP/out"
          git init -q -b jar
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" jar
